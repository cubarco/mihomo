name: Build custom

on:
  push:
    branches:
      - custom
  workflow_dispatch:

concurrency:
  group: custom-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/custom'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, goamd64: v1, output: amd64-v1 }
          - { goos: linux, goarch: arm64, output: arm64 }
          - { goos: linux, goarch: arm, goarm: '7', output: armv7 }
          - { goos: windows, goarch: amd64, goamd64: v1, output: amd64-v1 }
          - { goos: darwin, goarch: amd64, goamd64: v1, output: amd64-v1 }
          - { goos: darwin, goarch: arm64, output: arm64 }
          - { goos: android, goarch: arm64, ndk: aarch64-linux-android34, output: arm64-v8 }
    env:
      CGO_ENABLED: "0"
      DNS_AUTH_PRIVATE_KEY: ${{ secrets.MIHOMO_DNS_AUTH_PRIVATE_KEY }}
      DNS_AUTH_DOMAINS: ${{ vars.MIHOMO_DNS_AUTH_DOMAINS }}

    steps:
      - name: Check branch and DNSAuth settings
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/heads/custom"
          test -n "$DNS_AUTH_PRIVATE_KEY"
          test -n "$DNS_AUTH_DOMAINS"
          test "$(printf '%s' "$DNS_AUTH_PRIVATE_KEY" | base64 --decode | wc -c | tr -d ' ')" = "32"

      - name: Check out custom branch
        uses: actions/checkout@v6
        with:
          ref: custom

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          go-version: '1.26'

      - name: Set build environment
        shell: bash
        run: |
          echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          echo "CGO_ENABLED=0" >> "$GITHUB_ENV"
          echo "BUILD_EXTLDFLAGS=-extldflags --static" >> "$GITHUB_ENV"

      - name: Set up Android NDK
        if: ${{ matrix.goos == 'android' }}
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29-beta1

      - name: Set Android build environment
        if: ${{ matrix.goos == 'android' }}
        shell: bash
        run: |
          echo "CC=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/${{ matrix.ndk }}-clang" >> "$GITHUB_ENV"
          echo "CGO_ENABLED=1" >> "$GITHUB_ENV"
          echo "BUILD_EXTLDFLAGS=" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOAMD64: ${{ matrix.goamd64 }}
          GOARM: ${{ matrix.goarm }}
        run: |
          version="custom-${GITHUB_SHA::7}"
          build_time="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          mkdir -p dist
          output="mihomo-${{ matrix.goos }}-${{ matrix.output }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            output="${output}.exe"
          fi
          go build \
            -tags with_gvisor \
            -trimpath \
            -ldflags "$BUILD_EXTLDFLAGS -X github.com/metacubex/mihomo/constant.Version=$version -X github.com/metacubex/mihomo/constant.BuildTime=$build_time -X github.com/metacubex/mihomo/component/resolver.GlobalDNSAuthPrivateKey=$DNS_AUTH_PRIVATE_KEY -X github.com/metacubex/mihomo/component/resolver.GlobalDNSAuthDomains=$DNS_AUTH_DOMAINS -w -s -buildid=" \
            -o "dist/$output" \
            .
          if [ "${{ matrix.goos }}" = "windows" ]; then
            (cd dist && zip -9 "${output%.exe}-${version}.zip" "$output")
          else
            gzip -9 -c "dist/$output" > "dist/${output}-${version}.gz"
          fi
          (cd dist && sha256sum * > "SHA256SUMS-${{ matrix.goos }}-${{ matrix.output }}")

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.goos }}-${{ matrix.output }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
